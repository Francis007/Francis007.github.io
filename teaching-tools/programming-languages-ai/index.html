<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第 10 週互動動畫</title>
<meta name="description" content="非同步自學動畫，共六段，從機器語言、家譜、機器學習、卷積池化，一路講到 GAN 和大型語言模型。">
<style>
:root{
  --bg:#F2EEE3;--ink:#24211D;--ink2:#676158;--line:#B8B1A4;--acc:#C7522A;--acc2:#A8431F;
  --paper:#FBF8F1;--panel:#E8E1D1;--frame:#8F887C;--teal:#3E6E73;--tealL:#D6E4E1;--ochreL:#F1DEB0;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;
  --serif:"Noto Serif TC","Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#F2EEE3;color:#24211D;font-family:var(--sans);line-height:1.6;overflow-x:hidden}
button{font-family:inherit}
a{color:var(--acc2)}
#app{min-height:100vh;display:flex;flex-direction:column}
.view{flex:1 0 auto;width:100%}
.view[hidden]{display:none!important}
.foot{flex:0 0 auto;padding:9px 16px;font-size:13px;line-height:1.5;color:var(--ink2);border-top:1px solid var(--line);text-align:center;background:#EFEADD}

/* ---------- 目錄 ---------- */
#toc{max-width:1100px;margin:0 auto;padding:28px 16px 28px}
.kicker{margin:0;color:var(--acc2);font-weight:700;font-size:15px;letter-spacing:.04em}
#toc h1{font-family:var(--serif);font-size:30px;line-height:1.35;margin:4px 0 10px;font-weight:700}
.lead{margin:0 0 6px;font-size:17px;max-width:46em}
.lead2{margin:0 0 18px;font-size:15px;color:var(--ink2);max-width:46em}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 18px;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--paper);font-size:15px}
.resume[hidden]{display:none}
.resume a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.card a.go{display:flex;gap:14px;padding:16px 16px 12px;color:inherit;text-decoration:none;flex:1;min-height:44px}
.card a.go:hover{background:#FFFDF7}
.card a.go:focus-visible,.btn:focus-visible,.sub:focus-visible,.resume a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.num{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--acc2);color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;font-family:var(--serif)}
.card h3{margin:0 0 4px;font-family:var(--serif);font-size:19px;line-height:1.4}
.card p{margin:0;font-size:15px}
.card .meta{margin-top:8px;font-size:13px;color:var(--ink2)}
.sub{display:flex;align-items:center;min-height:44px;padding:0 16px;border-top:1px solid #E1DACB;font-size:14px;color:var(--acc2);text-decoration:none}
.sub:hover{background:#FFFDF7}
.selfread{margin:18px 0 0;padding:10px 14px;border-left:4px solid var(--acc);background:var(--paper);font-size:15px;max-width:52em}
.howto{margin:14px 0 0;font-size:14px;color:var(--ink2)}

/* ---------- 播放器 ---------- */
.p-head{display:flex;align-items:center;gap:12px;padding:8px 20px;border-bottom:1px solid var(--line);background:#EFEADD}
.p-title{flex:1;min-width:0}
.p-seg{font-size:13px;color:var(--ink2);display:block;line-height:1.4}
.p-title h2{font-family:var(--serif);font-size:21px;margin:0;line-height:1.35;font-weight:700}
.pages{font-size:13px;color:var(--ink2)}
.btn{min-height:46px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--frame);background:var(--paper);color:var(--ink);font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;touch-action:manipulation}
.btn:hover{background:#FFFDF7}
.btn.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.primary:hover{background:#933A1B}
.btn:disabled{opacity:.38;cursor:default}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn.small{font-size:15px;min-height:44px}
.p-main{padding:10px 20px 12px}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:14px;position:relative}
.stage svg.scene{display:block;width:100%;height:auto;aspect-ratio:5/3}
.stage svg.scene[hidden]{display:none}
.panel{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.stepbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--ink2);flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#D8D1C3}
.dot.done{background:#B9A88E}
.dot.cur{background:var(--acc)}
.s-title{font-family:var(--serif);font-size:20px;margin:0;line-height:1.4}
.cap{font-size:19px;line-height:1.75;margin:0}
.take{background:#FFF9EE;border:2px solid var(--acc);border-radius:12px;padding:10px 11px 12px}
.take[hidden]{display:none}
.take-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 6px;font-weight:700;font-size:17px;color:var(--acc2)}
.tag{display:inline-block;background:var(--acc2);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;line-height:1.7}
.tag.soft{background:var(--teal)}
.take .tnote{font-size:14px;font-weight:400;color:var(--ink2)}
.take p.li{position:relative;padding-left:15px;margin:5px 0 0}
.take p.li::before{content:"";position:absolute;left:3px;top:.74em;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.take p.gh{margin:9px 0 0;display:flex;align-items:center}
.take p.gh b.gl{display:inline-block;background:var(--teal);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;line-height:1.7}
.take p.gh b.gl i{font-style:normal;font-size:0}
.take p{margin:5px 0 0;font-size:17px;line-height:1.55}
.take b{color:var(--acc2)}
.take-more{padding:0 4px}
.take-more[hidden]{display:none}
.take-more p{margin:0;font-size:16px;line-height:1.7;color:var(--ink2)}
.take-more b{color:var(--ink2)}
.take strong{color:var(--acc);font-weight:700}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.after{display:flex;gap:8px}
.after .btn{flex:1}
.after[hidden]{display:none}
.keys{margin:0;font-size:13px;color:var(--ink2)}
.rotate-hint{display:none;margin:6px 0 0;font-size:13px;color:var(--ink2)}

@media (min-width:900px) and (min-height:560px){
  #player:not([hidden]){display:flex;flex-direction:column;height:calc(100vh - 39px);min-height:520px}
  .p-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}
  .stage{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .stage svg.scene{width:100%;height:100%;aspect-ratio:auto}
  .panel{padding-top:0;min-height:0;overflow:auto}
  .ctrls{margin-top:auto}
}
@media (max-width:899px),(max-height:559px){
  .p-head{flex-wrap:wrap;padding:8px 16px;row-gap:2px}
  .pages{order:3;flex-basis:100%}
  .p-main{padding:10px 16px 16px}
  .rotate-hint{display:block}
}
@media (max-width:599px){
  .stage svg.scene.stack{aspect-ratio:25/52}
}
@media (max-width:420px){
  #toc h1{font-size:25px}
  .p-title h2{font-size:18px}
  .cap{font-size:18px}
  .take p{font-size:17px}
  .btn{font-size:16px;padding:6px 8px}
  .cards{grid-template-columns:1fr}
  .keys{display:none}
}

/* ---------- SVG 場景 ---------- */
.scene text{font-family:var(--sans)}
.nt,.nt *{transition:none!important}
.still .scene *,.still .scene{transition:none!important;animation:none!important}
.scene.stack .rhalf{transform:translate(-500px,520px)}
.scene.stack .divider{display:none}
.cpu-box{fill:#ECE6D8;stroke:#8F887C;stroke-width:3;transition:stroke .4s,stroke-width .4s}
.cpu-box.hi{stroke:#C7522A;stroke-width:6}
.lab .f{fill:#A8431F;font-weight:700}
.lab .m{fill:#676158}
.tile .bg{fill:#F4EFE3;stroke:#B8B1A4;stroke-width:2;transition:stroke .3s,stroke-width .3s,fill .3s}
.tile.hi .bg{fill:#FFF3E0;stroke:#C7522A;stroke-width:5}
.bar{fill:#D9D2C4;transition:fill .3s}
.bar.on{fill:#C7522A}
.mach{fill:#EEF3F1;stroke:#3E6E73;stroke-width:3;transition:fill .3s,stroke .3s}
.mach.tra{fill:#F6E7C4;stroke:#B98A2E}
.card-glow{fill:none;stroke:transparent;stroke-width:5;transition:stroke .3s}
.card-glow.on{stroke:#C7522A}
.tdot{fill:#E8E1D1;stroke:#8F887C;stroke-width:3;transition:fill .3s,stroke .3s}
.tdot.dark{fill:#3E6E73;stroke:#3E6E73}
.tdot.acc{fill:#C7522A;stroke:#A8431F}
.tdot.ppl{fill:#8C6A9A;stroke:#6E4F7C}
.btn2 rect{fill:#F4EFE3;stroke:#8F887C;stroke-width:2.5;transition:fill .3s,stroke .3s}
.btn2 text{fill:#24211D}
.btn2.hi rect{fill:#F7CDB0;stroke:#C7522A;stroke-width:4}
.cd rect{fill:#F4EFE3;stroke:#B8B1A4;stroke-width:2.5;transition:fill .3s,stroke .3s,stroke-width .3s}
.cd.on rect{fill:#FFF3E0;stroke:#C7522A;stroke-width:5}
.rw{fill:#EFEBE2;stroke:#D2CBBE;stroke-width:1.5;transition:fill .3s,stroke .3s}
.rw.on{fill:#C99A3A;stroke:#A9812A}
.wire line{stroke:#CFC8BA;stroke-width:1.5;transition:stroke .3s,stroke-width .3s}
.wire.on line{stroke:#6E9A9C;stroke-width:1.8}
.ringd{fill:#FBE9DF;stroke:#B8B1A4;stroke-width:3;transition:fill .3s,stroke .3s}
.ringd.on{fill:#F7CDB0;stroke:#C7522A}
.pblk{fill:transparent;transition:fill .3s}
.pblk.on{fill:#FFE3A6}
.wd rect{fill:#EFEBE2;stroke:#B8B1A4;stroke-width:2.5;transition:fill .3s,stroke .3s,stroke-width .3s}
.wd.hi rect{fill:#FFE3A6;stroke:#C7522A;stroke-width:4}
.att{stroke:#3E6E73;stroke-width:5;transition:stroke .4s,stroke-width .4s}
.att.thick{stroke:#3E6E73;stroke-width:13}
.att.mid{stroke:#3E6E73;stroke-width:7}
.att.thin{stroke:#3E6E73;stroke-width:2.5}
.ab rect{fill:#EFEBE2;stroke:#D2CBBE;stroke-width:2.5;transition:fill .3s,stroke .3s}
.ab text{fill:#A39B8D;transition:fill .3s}
.ab.on rect{fill:#C9DEDA;stroke:#3E6E73}
.ab.on text{fill:#24211D}
.cdt .bgc{fill:#F4EFE3;stroke:#B8B1A4;stroke-width:2.5;transition:fill .3s,stroke .3s,stroke-width .3s}
.cdt.pick .bgc{fill:#F1DEB0;stroke:#C99A3A;stroke-width:4}
.hl{transition:fill .3s,stroke .3s,stroke-width .3s}
@keyframes k-bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes k-pulse{from{opacity:.35}to{opacity:1}}
.lp-bob{animation:k-bob .32s ease-in-out infinite alternate}
.lp-pulse{animation:k-pulse .9s ease-in-out infinite alternate}

@media (prefers-reduced-motion:reduce){
  .scene [class*="lp-"]{animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <section id="toc" class="view" aria-labelledby="tocTitle">
    
    <h1 id="tocTitle">互動動畫：程式語言與 AI 應用</h1>
    <p class="lead">六段動畫。按「下一步」或鍵盤右鍵，一步一步往下看；每一步都有文字說明，不開聲音也看得懂。每段最後一步是「這段要記得」。</p>
    <p class="lead2">建議先看完各段動畫。動畫裡的數字是例子，看懂流程就好。</p>
    <div id="resume" class="resume" hidden></div>
    <ol id="cards" class="cards"></ol>
    <p class="howto">分享或截圖時，網址後面加 ?a=段號&amp;s=步號，可以直接打開某一段的某一步，例如 ?a=2&amp;s=4。</p>
  </section>

  <section id="player" class="view" hidden aria-label="動畫播放">
    <header class="p-head">
      <button id="bToc" class="btn small" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>回目錄</button>
      <div class="p-title">
        <span id="pSeg" class="p-seg"></span>
        <h2 id="pTitle"></h2>
      </div>
      <span id="pPages" class="pages"></span>
    </header>
    <div class="p-main">
      <div id="stage" class="stage"></div>
      <div class="panel">
        <p class="rotate-hint">手機橫放，圖會比較大。</p>
        <div class="stepbar"><span id="pStep"></span><span id="dots" class="dots" aria-hidden="true"></span></div>
        <h3 id="sTitle" class="s-title"></h3>
        <p id="cap" class="cap" aria-live="polite"></p>
        <div id="take" class="take" hidden aria-live="polite"></div>
        <div id="takeMore" class="take-more" hidden aria-live="polite"></div>
        <div class="ctrls">
          <button id="bPrev" class="btn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>上一步</button>
          <button id="bNext" class="btn primary" type="button">下一步<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="bAuto" class="btn" type="button" aria-pressed="false"></button>
          <button id="bHome" class="btn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10a5.5 5.5 0 1 0 1.8-4.1M4.5 3.5v3.2h3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>從頭</button>
        </div>
        <div id="after" class="after" hidden>
          <button id="bNextSeg" class="btn primary" type="button"></button>
        </div>
        <p class="keys">鍵盤左右鍵也能換步。</p>
      </div>
    </div>
  </section>
  <footer class="foot">非同步自學動畫</footer>
</div>
<script>
(function () {

var DATA = {"animations":[{"no":1,"title":"食譜用什麼文字寫：機器語言、組合語言、高階語言","tocLine":"看主廚為什麼看不懂簡寫食譜、換一間廚房為什麼就不能用，再看整本先翻和唸一行翻一行差在哪。","tocPages":"","tocLinks":[{"s":6,"label":"從第 6 步開始看（編譯和直譯）"}],"steps":[{"title":"機器語言：只用 0 和 1","caption":"食譜只用 0 和 1 寫成，就是機器語言。主廚直接看得懂的，只有這一種。"},{"title":"組合語言：好記的簡寫","caption":"CPU 開發者替每個指令訂了好記的簡寫，叫助憶符。用簡寫寫成的食譜，就是組合語言。"},{"title":"組譯器：把簡寫換回代碼","caption":"主廚只認代碼，看不懂 ADD 這三個字母。簡寫食譜要先交給組譯器，換回代碼才能做。"},{"title":"換一間廚房就不能用","caption":"每種電腦的代碼和簡寫都不同，換一間廚房就不能用。機器語言和組合語言都很難讀懂，所以叫低階語言。"},{"title":"高階語言：寫給人看，換廚房也能用","caption":"高階語言用一般文字寫，例子是 C。它和機器特性沒有密切對應，所以可攜性較高。"},{"title":"編譯：整本先翻好","caption":"高階食譜要先翻譯。編譯像整本交給翻譯社，翻完印成代碼版，主廚之後照著做，不用再翻。"},{"title":"直譯：翻好一行就做一行","caption":"直譯器逐行翻譯，翻好一行就立即執行。像口譯員在旁邊唸一行翻一行，LISP 採用直譯。"},{"title":"這段要記得","caption":"這段要記得的事，分兩欄。"}],"takeGroups":[{"tag":"重點","items":[{"text":"電腦硬體唯一能直接理解的是機器語言。"},{"text":"C 是高階語言，C 的程式比組合語言的程式可攜性高。"}]},{"tag":"練習","items":[{"text":"組合語言用組譯器翻成機器語言。機器語言和組合語言都是低階語言。"},{"text":"整份原始程式碼先翻成目的碼再執行。","label":"編譯"},{"text":"翻一行、執行一行，LISP 採用直譯。","label":"直譯"}]}]},{"no":2,"title":"家譜上要記的事：從 FORTRAN 到 ASP.NET","tocLine":"在時間軸上找 FORTRAN 和 C，用一疊盤子看類別，再看伺服器怎麼替兩個人組出不同的網頁。","tocPages":"","tocLinks":[{"s":3,"label":"從第 3 步開始看（類別）"},{"s":5,"label":"從第 5 步開始看（C# 和 ASP.NET）"}],"steps":[{"title":"時間軸上的第一個","caption":"FORTRAN 是第一個高階語言，在時間軸最早的位置。COBOL 排在後面，專做商業資料處理。"},{"title":"C 為 UNIX 而生","caption":"貝爾實驗室為了設計 UNIX 作業系統，研發出 C 語言。所以說，C 是專門為了開發 UNIX 而研發的。"},{"title":"C++：stack 類別像一疊盤子","caption":"C++ 把物件導向加進 C。stack 這個類別像一疊盤子，資料是最上面第幾個、每格放什麼，行為是放上去、拿下來。"},{"title":"放上去、拿下來，資料跟著變","caption":"放上一個盤子，最上面的位置跟著變；拿走一個，又變回來。資料和行為寫在同一個類別裡，叫封裝。"},{"title":"C# 和 ASP.NET","caption":"ASP.NET 是微軟的網頁開發平台。C# 常用於 ASP.NET 開發，是以 C 為基礎的物件導向程式語言。"},{"title":"ASP.NET 在伺服器端組出網頁","caption":"ASP.NET 在伺服器端產生動態網頁。要求送到伺服器，照程式當場組好再送回，每個人拿到的內容可以不同。"},{"title":"這段要記得","caption":"五件要記得的事。"}],"takeGroups":[{"tag":"重點","items":[{"text":"第一個高階程式語言是 FORTRAN。"},{"text":"C 是專門為了開發 UNIX 作業系統而研發的。"},{"text":"類別裡可以定義資料和行為。"},{"text":"ASP.NET 是微軟的網頁開發平台，在伺服器端產生動態網頁。"},{"text":"C# 是基於 C 的物件導向程式語言，常用於 ASP.NET 開發。"}]}]},{"no":3,"title":"機器學習的四種學習方式：差在答案有多少，有沒有獎勵","tocLine":"用香料罐和海豚，一種一種看機器學習的四種學法，差在答案給多少、有沒有獎勵。","tocPages":"","tocLinks":[],"steps":[{"title":"從資料裡學：分成四種","caption":"機器學習不再靠人把規則一條條寫好，改讓電腦從資料裡學。通常把它分成四種，各有不同的學法。"},{"title":"監督式：每筆資料都有標準答案","caption":"監督式學習，就是每筆資料都附上正確答案，也叫標籤。機器拿自己的判斷和標籤比，看出誤差，再改進。"},{"title":"非監督式：自己分成幾堆","caption":"非監督式學習，沒有事先給正確答案，讓電腦自己找出規律。像把沒貼標籤的香料，自己分成幾堆。"},{"title":"半監督式：少數有答案","caption":"半監督式學習介於兩者之間。先用少量有答案的資料學出初步模型，替沒答案的猜標籤，再合起來重新學一次。"},{"title":"增強式：做得好就給獎勵","caption":"增強式學習，也叫強化學習。判斷做得好就給獎勵，下次遇到同樣狀況，機器就傾向做同樣的判斷，像海豚跳得漂亮就有食物。"},{"title":"四種並排比一比","caption":"機器學習常分成這四種。深度學習不在其中，它說的是用哪種網路來學，後面會講。"},{"title":"這段要記得","caption":"這段要記得的事，分兩欄。"}],"takeGroups":[{"tag":"重點","items":[{"text":"機器學習分四種：監督式、非監督式、半監督式、增強式（也叫強化學習）。"},{"text":"每筆資料都給正確答案（標籤）的是監督式。"}]},{"tag":"練習","items":[{"text":"非監督式沒有事先給答案，自己分群。增強式做得好就給獎勵。"}]}]},{"no":4,"title":"卷積和池化：過濾器在哪一層","tocLine":"看藍色小方框在影像上滑動、乘完加總，再看紅線把矩陣切成四塊、每塊只留一個數。","tocPages":"","tocLinks":[{"s":3,"label":"從第 3 步開始看（卷積和池化）"}],"steps":[{"title":"類神經網路：三種層","caption":"類神經網路畫出來，是一群圓圈用線連起來。最左邊一排是輸入層，最右邊一排是輸出層，中間的叫隱藏層。"},{"title":"深度學習：隱藏層很多","caption":"隱藏層有很多層，就叫深度學習。範圍由大到小，是人工智慧、機器學習、深度學習。"},{"title":"CNN：兩個零件","caption":"卷積神經網路簡稱 CNN，很會辨識單張圖片。它有兩個重要的零件，卷積層和池化層，最後接全連接層。"},{"title":"卷積層：過濾器蓋在影像上","caption":"卷積層會針對重要的特徵設計對應的過濾器。把過濾器蓋在影像左上角，對應位置相乘再全部加起來，得到 53。"},{"title":"滑一格，再算一次","caption":"過濾器往右、往下一格一格滑過去，每到一個位置，就把對到的數字相乘再加起來。四個結果排好，就是結果矩陣。"},{"title":"池化層：一塊留一個數","caption":"池化層把矩陣切成一小塊一小塊，每塊只留一個數。最大池化留最大的，左上這塊是 36；平均池化留平均，是 33。"},{"title":"這段要記得","caption":"兩個零件，差在有沒有過濾器。"}],"takeGroups":[{"tag":"重點","items":[{"text":"CNN 裡，用過濾器突出特徵的是卷積層；池化層只是把一塊數字取最大值或平均值，沒有過濾器。"}]},{"tag":"補充","items":[{"text":"深度學習是隱藏層很多的類神經網路。"},{"text":"範圍由大到小：人工智慧、機器學習、深度學習。"}]}]},{"no":5,"title":"GAN 和自注意力：學徒和評審較勁，讀到「它」時在算什麼","tocLine":"看學徒和評審怎麼互相較勁，再用線的粗細看模型讀到「它」的時候在算什麼。","tocPages":"","tocLinks":[{"s":5,"label":"從第 5 步開始看（自注意力）"}],"steps":[{"title":"GAN：兩個部分","caption":"生成對抗網路簡稱 GAN，由生成器和判別器兩個部分組成。生成器也叫生成網路，判別器也叫判別網路。"},{"title":"生成器：從隨機數字做出圖","caption":"生成器從一些隨機的數字開始，做出一張圖片。像學徒先隨手仿做一件作品。"},{"title":"判別器：分辨真的和生成的","caption":"判別器同時看真實圖片和生成的圖片，判斷哪一張是真的。像評審拿放大鏡，分辨哪一件是大廚的原作。"},{"title":"對抗：互相較勁，一起進步","caption":"生成器想做出騙得過判別器的圖，判別器想抓出假的。兩邊互相較勁，一起進步，生成的圖越來越像真的。"},{"title":"句子太長，會忘記開頭","caption":"早期模型讀到太長的句子，會忘記開頭的資訊。生成文字用的 Transformer，加入自注意力機制來改善。"},{"title":"自注意力：算關聯強度","caption":"自注意力機制算的，是文字和文字之間的關聯強度，也叫權重。讀到「它」時，就要算它和每個詞的關聯強度。"},{"title":"結果：知道「它」指的是冰淇淋","caption":"「它」和「冰淇淋」關聯最強，和「冰箱」比較弱，所以模型知道，「它」指的是冰淇淋。線越粗，關聯越強。"},{"title":"這段要記得","caption":"兩件要記得的事。"}],"takeGroups":[{"tag":"重點","items":[{"text":"GAN 由生成器與判別器相互對抗組成。"},{"text":"Transformer 的自注意力機制，計算文字之間的關聯強度（權重）。"}]}]},{"no":6,"title":"大型語言模型：從文字接龍到一步步思考","tocLine":"看模型怎麼一個字一個字接龍、規模過了臨界點多出什麼本事，以及為什麼它講得通順卻可能講錯。","tocPages":"","tocLinks":[{"s":3,"label":"從第 3 步開始看（幻覺和查證）"},{"s":6,"label":"從第 6 步開始看（思維鏈）"}],"steps":[{"title":"文字接龍","caption":"大型語言模型，簡稱 LLM，像一台機率預測機。根據前面的字，算出下一個最可能的字，像文字接龍。"},{"title":"湧現能力：規模過了臨界點","caption":"模型規模突破某個臨界點，會突然具備小模型沒有的能力，例如語法結構、邏輯推理。這叫湧現能力。"},{"title":"幻覺：通順，卻不符事實","caption":"LLM 可能寫出非常通順的文章，內容卻不符合事實。這種一本正經卻胡說八道的現象，叫幻覺。"},{"title":"為什麼會幻覺：沒有去查","caption":"LLM 算的是字和字之間的機率關係，沒有去資料庫查驗證過的資料，所以可能講得通順卻講錯。"},{"title":"驗證是使用者自己的職責","caption":"驗證 LLM 的輸出對不對，是使用者自己的職責。AI 給的資料，要自己去找原始出處核對。"},{"title":"CoT：請一步一步思考","caption":"要求 AI 一步一步思考的提示詞技術，叫思維鏈，英文縮寫 CoT。"},{"title":"這段要記得","caption":"這段要記得的事，分兩欄。"}],"takeGroups":[{"tag":"重點","items":[{"text":"LLM 的湧現能力：模型規模達到臨界點時，具備小模型所沒有的高階能力。"},{"text":"LLM 會有幻覺，ChatGPT 給的資料要查證。"},{"text":"要求 AI 一步步思考的提示詞技術叫 CoT（思維鏈）。"}]},{"tag":"練習","items":[{"text":"LLM 根據前面的字，算出下一個最可能出現的字。"}]}]}]};

/* ---------- 播放器 ---------- */
var P = {a: 0, k: 0, sc: null, timers: [], auto: false, autoTimer: null};
var $ = function (id) { return document.getElementById(id); };
function clearTimers() {
  P.timers.forEach(clearTimeout); P.timers = [];
  if (P.autoTimer) { clearTimeout(P.autoTimer); P.autoTimer = null; }
}
function capLen(a, k) { return DATA.animations[a - 1].steps[k - 1].caption.replace(/\s/g, '').length; }
/* 最後一步「這段要記得」的整理框文字（標籤、各條），和畫面上 #take 的文字相同 */
function takeText(a) {
  var A = DATA.animations[a - 1], out = '';
  A.takeGroups.forEach(function (g, gi) {
    out += g.tag + (gi ? '：' : '');
    g.items.forEach(function (it) { out += (it.label ? it.label + '：' : '') + it.text; });
  });
  return out;
}
function takeLen(a) { return takeText(a).replace(/\s/g, '').length; }
/* 每步停留：字卡字數 × 250 毫秒（至少 4 秒、最多 14 秒）；最後一步要讓人讀完整理框，字卡加整理框每字 250 毫秒，不設上限 */
function dwell(a, k) {
  if (k === SEQ[a].steps.length) return (capLen(a, k) + takeLen(a)) * 250;
  return Math.min(14000, Math.max(4000, capLen(a, k) * 250));
}
function seqEnd(a, k) { var e = 0; SEQ[a].steps[k - 1].seq.forEach(function (ev) { e = Math.max(e, ev[0] + ev[1]); }); return e; }
function playStep(n) {
  var def = SEQ[P.a].steps[n - 1], sc = P.sc, target = stateAt(P.a, n);
  setLoops(sc, def.loops);
  if (STILL) { render(sc, target, 0); return 0; }
  if (RM) { render(sc, target, 400, true); P.timers.push(setTimeout(function () { render(sc, target, 0); }, 450)); return 450; }
  var cur = cloneSt(stateAt(P.a, n - 1)), end = 0;
  def.seq.forEach(function (ev) {
    end = Math.max(end, ev[0] + ev[1]);
    P.timers.push(setTimeout(function () {
      mergeInto(cur, ev[2], P.a);
      for (var id in ev[2]) paint(sc, id, cur[id], ev[1], false, isLin(ev));
    }, ev[0] + 30));
  });
  P.timers.push(setTimeout(function () { render(sc, target, 0); }, end + 90));
  return end + 90;
}
function go(n, animate) {
  var N = SEQ[P.a].steps.length;
  n = Math.max(1, Math.min(N, n));
  clearTimers();
  var end = 0;
  P.k = n;
  applyLayout();
  if (animate) { render(P.sc, stateAt(P.a, n - 1), 0); end = playStep(n); }
  else { render(P.sc, stateAt(P.a, n), 0); setLoops(P.sc, SEQ[P.a].steps[n - 1].loops); }
  if (P.auto) {
    if (n >= N) setAuto(false);
    else P.autoTimer = setTimeout(function () { go(P.k + 1, true); }, end + dwell(P.a, n));
  }
  updateUI(); updateURL(); save();
}
function restart() {
  clearTimers();
  P.k = 0;
  render(P.sc, stateAt(P.a, 0), 0);
  go(1, true);
}
function setAuto(on) {
  P.auto = on;
  var b = $('bAuto');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = on
    ? '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="11.5" y="4" width="3.5" height="12" rx="1" fill="currentColor"/></svg>暫停'
    : '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor"/></svg>自動播放';
  if (!on && P.autoTimer) { clearTimeout(P.autoTimer); P.autoTimer = null; }
}
function toggleAuto() {
  if (P.auto) { setAuto(false); return; }
  setAuto(true);
  var N = SEQ[P.a].steps.length;
  if (P.k >= N) restart();
  else P.autoTimer = setTimeout(function () { go(P.k + 1, true); }, 700);
}
function kw(parent, text, words) {
  if (!words || !words.length) { parent.appendChild(document.createTextNode(text)); return; }
  var re = new RegExp('(' + words.map(function (w) { return w.replace(/[()（）]/g, '\\$&'); }).join('|') + ')', 'g');
  text.split(re).forEach(function (part) {
    if (!part) return;
    if (words.indexOf(part) >= 0) { var s = document.createElement('strong'); s.textContent = part; parent.appendChild(s); }
    else parent.appendChild(document.createTextNode(part));
  });
}
var BOLD = {};
function updateUI() {
  var A = DATA.animations[P.a - 1], N = A.steps.length, st = A.steps[P.k - 1], last = P.k === N;
  $('pSeg').textContent = '第 ' + P.a + ' 段／共 ' + NA + ' 段';
  $('pTitle').textContent = A.title;
  $('pPages').textContent = '對應' + A.tocPages;
  $('pStep').textContent = '第 ' + P.k + ' 步／共 ' + N + ' 步';
  $('sTitle').textContent = st.title;
  var dots = $('dots'); dots.textContent = '';
  for (var i = 1; i <= N; i++) { var d = document.createElement('span'); d.className = 'dot' + (i < P.k ? ' done' : '') + (i === P.k ? ' cur' : ''); dots.appendChild(d); }
  var cap = $('cap'), take = $('take'), more = $('takeMore');
  more.hidden = true; more.textContent = '';
  if (last) {
    cap.hidden = true; cap.textContent = ''; take.hidden = false; take.textContent = '';
    var bold = BOLD[P.a];
    A.takeGroups.forEach(function (g, gi) {
      if (gi === 0) {
        var h = document.createElement('p'); h.className = 'take-h';
        var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = g.tag; h.appendChild(tg);
        take.appendChild(h);
      } else {
        var gh = document.createElement('p'); gh.className = 'gh';
        var gb = document.createElement('b'); gb.className = 'gl'; gb.appendChild(document.createTextNode(g.tag));
        var gi2 = document.createElement('i'); gi2.textContent = '：'; gb.appendChild(gi2);
        gh.appendChild(gb); take.appendChild(gh);
      }
      g.items.forEach(function (it) {
        var p = document.createElement('p'); p.className = 'li';
        if (it.label) { var b = document.createElement('b'); b.textContent = it.label + '：'; p.appendChild(b); }
        kw(p, it.text, bold);
        take.appendChild(p);
      });
    });
  } else { take.hidden = true; take.textContent = ''; cap.hidden = false; cap.textContent = st.caption; }
  $('bPrev').disabled = P.k <= 1;
  $('bNext').disabled = last;
  var after = $('after'), nb = $('bNextSeg');
  after.hidden = !last;
  nb.textContent = P.a < NA ? '看下一段：第 ' + (P.a + 1) + ' 段' : '回目錄';
}
function buildURL(a, s, play) {
  var q = new URLSearchParams();
  if (a) { q.set('a', a); if (s) q.set('s', s); if (s && play) q.set('play', '1'); }
  if (STILL) q.set('still', '1');
  var str = q.toString();
  return location.pathname + (str ? '?' + str : '');
}
function updateURL() { try { history.replaceState(null, '', buildURL(P.a, P.k)); } catch (e) {} }
function save() { try { localStorage.setItem('w10anim-last', JSON.stringify({a: P.a, s: P.k})); } catch (e) {} }
function load() { try { var v = JSON.parse(localStorage.getItem('w10anim-last') || 'null'); if (v && v.a >= 1 && v.a <= NA && v.s >= 1) return v; } catch (e) {} return null; }

function showToc() {
  clearTimers(); setAuto(false);
  if (P.sc) setLoops(P.sc, []);
  $('player').hidden = true; $('toc').hidden = false;
  document.title = '第 10 週互動動畫';
  var last = load(), rs = $('resume');
  rs.textContent = '';
  if (last && DATA.animations[last.a - 1] && last.s <= DATA.animations[last.a - 1].steps.length) {
    rs.appendChild(document.createTextNode('上次看到第 ' + last.a + ' 段第 ' + last.s + ' 步。'));
    var a = document.createElement('a'); a.href = buildURL(last.a, last.s); a.textContent = '從那裡接著看';
    a.addEventListener('click', function (e) { e.preventDefault(); nav(last.a, last.s); });
    rs.appendChild(a); rs.hidden = false;
  } else rs.hidden = true;
}
function openAnim(a, s, play) {
  clearTimers(); setAuto(false);
  if (P.sc) setLoops(P.sc, []);
  $('toc').hidden = true; $('player').hidden = false;
  var sc = getScene(a);
  for (var k in SCENES) SCENES[k].svg.style.display = (Number(k) !== a) ? 'none' : '';
  P.a = a; P.sc = sc;
  document.title = '第 ' + a + ' 段｜第 10 週互動動畫';
  var N = SEQ[a].steps.length;
  if (s >= 1 && s <= N) {
    if (play && s > 1) {
      /* 先停在前一步的最後樣子，再自動演這一步 */
      P.k = s - 1; applyLayout(); render(sc, stateAt(a, s - 1), 0); setLoops(sc, SEQ[a].steps[s - 2].loops);
      updateUI();
      P.timers.push(setTimeout(function () { go(s, true); }, 900));
    } else if (play) restart();
    else go(s, false);
  } else restart();
}
function nav(a, s, play) {
  try { history.pushState(null, '', buildURL(a, s, play)); } catch (e) {}
  if (a) openAnim(a, s, play); else showToc();
  window.scrollTo(0, 0);
}
function parse(search) {
  var q = new URLSearchParams(search), a = parseInt(q.get('a'), 10), s = parseInt(q.get('s'), 10);
  if (!(a >= 1 && a <= NA)) return {a: 0, s: 0, play: false};
  var N = SEQ[a].steps.length;
  return {a: a, s: (s >= 1 && s <= N) ? s : 0, play: q.get('play') === '1'};
}
function route() { var r = parse(location.search); if (r.a) openAnim(r.a, r.s, r.play); else showToc(); }

/* 目錄卡片 */
function buildToc() {
  var ol = $('cards');
  DATA.animations.forEach(function (A, i) {
    var a = i + 1, li = document.createElement('li'); li.className = 'card';
    var go1 = document.createElement('a'); go1.className = 'go'; go1.href = buildURL(a, 0);
    go1.addEventListener('click', function (e) { e.preventDefault(); nav(a, 0); });
    var n = document.createElement('span'); n.className = 'num'; n.textContent = a; go1.appendChild(n);
    var box = document.createElement('span');
    var h = document.createElement('h3'); h.textContent = A.title; box.appendChild(h);
    var p = document.createElement('p'); p.textContent = A.tocLine; box.appendChild(p);
    var m = document.createElement('p'); m.className = 'meta'; m.textContent = '對應' + A.tocPages + '・' + A.steps.length + ' 步'; box.appendChild(m);
    go1.appendChild(box); li.appendChild(go1);
    (A.tocLinks || []).forEach(function (c) {
      var sub = document.createElement('a'); sub.className = 'sub'; sub.href = buildURL(a, c.s, true);
      sub.textContent = c.label;
      sub.addEventListener('click', function (e) { e.preventDefault(); nav(a, c.s, true); });
      li.appendChild(sub);
    });
    ol.appendChild(li);
  });
}

$('bToc').addEventListener('click', function () { nav(0, 0); });
$('bPrev').addEventListener('click', function () { setAuto(false); if (P.k > 1) go(P.k - 1, false); });
$('bNext').addEventListener('click', function () { if (P.k < SEQ[P.a].steps.length) go(P.k + 1, true); });
$('bHome').addEventListener('click', function () { restart(); });
$('bAuto').addEventListener('click', toggleAuto);
$('bNextSeg').addEventListener('click', function () { if (P.a < NA) nav(P.a + 1, 0); else nav(0, 0); });
document.addEventListener('keydown', function (e) {
  if ($('player').hidden || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); if (P.k < SEQ[P.a].steps.length) go(P.k + 1, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); setAuto(false); if (P.k > 1) go(P.k - 1, false); }
});
window.addEventListener('popstate', route);
if (NARROW) {
  var onNarrow = function () { applyLayout(); };
  if (NARROW.addEventListener) NARROW.addEventListener('change', onNarrow); else if (NARROW.addListener) NARROW.addListener(onNarrow);
}

setAuto(false);
buildToc();
route();

/* 給測試用的唯讀介面 */
window.__W10 = {
  parse: parse,
  steps: function (a) { return SEQ[a].steps.length; },
  state: function () { return {a: P.a, k: P.k, still: STILL, auto: P.auto, stack: P.sc ? P.sc.svg.classList.contains('stack') : false}; },
  show: function (a, s) { openAnim(a, s); return {a: P.a, k: P.k, caption: $('cap').hidden ? $('take').textContent : $('cap').textContent}; },
  seqEnd: seqEnd, dwell: dwell,
  timing: function () { var out = []; for (var a = 1; a <= NA; a++) { var t = 0; for (var k = 1; k <= SEQ[a].steps.length; k++) t += seqEnd(a, k) + 90 + dwell(a, k); out.push(t); } return out; }
};
})();
</script>
