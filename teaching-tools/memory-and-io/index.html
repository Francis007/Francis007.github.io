<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第 5 週互動動畫</title>
<meta name="description" content="非同步自學動畫，共五段，從記憶體的金字塔一路講到冰箱和倉庫。">
<style>
:root{
  --bg:#F2EEE3;--ink:#24211D;--ink2:#676158;--line:#B8B1A4;--acc:#C7522A;--acc2:#A8431F;
  --paper:#FBF8F1;--panel:#E8E1D1;--frame:#8F887C;--teal:#3E6E73;--tealL:#D6E4E1;--ochreL:#F1DEB0;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;
  --serif:"Noto Serif TC","Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#F2EEE3;color:#24211D;font-family:var(--sans);line-height:1.6;overflow-x:hidden}
button{font-family:inherit}
a{color:var(--acc2)}
#app{min-height:100vh;display:flex;flex-direction:column}
.view{flex:1 0 auto;width:100%}
.view[hidden]{display:none!important}
.foot{flex:0 0 auto;padding:9px 16px;font-size:13px;line-height:1.5;color:var(--ink2);border-top:1px solid var(--line);text-align:center;background:#EFEADD}

/* ---------- 目錄 ---------- */
#toc{max-width:1100px;margin:0 auto;padding:28px 16px 28px}
.kicker{margin:0;color:var(--acc2);font-weight:700;font-size:15px;letter-spacing:.04em}
#toc h1{font-family:var(--serif);font-size:30px;line-height:1.35;margin:4px 0 10px;font-weight:700}
.lead{margin:0 0 6px;font-size:17px;max-width:46em}
.lead2{margin:0 0 18px;font-size:15px;color:var(--ink2);max-width:46em}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 18px;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--paper);font-size:15px}
.resume[hidden]{display:none}
.resume a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.card a.go{display:flex;gap:14px;padding:16px 16px 12px;color:inherit;text-decoration:none;flex:1;min-height:44px}
.card a.go:hover{background:#FFFDF7}
.card a.go:focus-visible,.btn:focus-visible,.sub:focus-visible,.resume a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.num{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--acc2);color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;font-family:var(--serif)}
.card h3{margin:0 0 4px;font-family:var(--serif);font-size:19px;line-height:1.4}
.card p{margin:0;font-size:15px}
.card .meta{margin-top:8px;font-size:13px;color:var(--ink2)}
.sub{display:flex;align-items:center;min-height:44px;padding:0 16px;border-top:1px solid #E1DACB;font-size:14px;color:var(--acc2);text-decoration:none}
.sub:hover{background:#FFFDF7}
.howto{margin:20px 0 0;font-size:14px;color:var(--ink2)}

/* ---------- 播放器 ---------- */
.p-head{display:flex;align-items:center;gap:12px;padding:8px 20px;border-bottom:1px solid var(--line);background:#EFEADD}
.p-title{flex:1;min-width:0}
.p-seg{font-size:13px;color:var(--ink2);display:block;line-height:1.4}
.p-title h2{font-family:var(--serif);font-size:21px;margin:0;line-height:1.35;font-weight:700}
.pages{font-size:13px;color:var(--ink2)}
.btn{min-height:46px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--frame);background:var(--paper);color:var(--ink);font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;touch-action:manipulation}
.btn:hover{background:#FFFDF7}
.btn.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.primary:hover{background:#933A1B}
.btn:disabled{opacity:.38;cursor:default}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn.small{font-size:15px;min-height:44px}
.p-main{padding:10px 20px 12px}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:14px;position:relative}
.stage svg.scene{display:block;width:100%;height:auto;aspect-ratio:5/3}
.stage svg.scene[hidden]{display:none}
.panel{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.stepbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--ink2);flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#D8D1C3}
.dot.done{background:#B9A88E}
.dot.cur{background:var(--acc)}
.s-title{font-family:var(--serif);font-size:20px;margin:0;line-height:1.4}
.cap{font-size:19px;line-height:1.75;margin:0}
.take{background:#FFF9EE;border:2px solid var(--acc);border-radius:12px;padding:10px 14px 12px}
.take[hidden]{display:none}
.take-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 6px;font-weight:700;font-size:17px;color:var(--acc2)}
.tag{display:inline-block;background:var(--acc2);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;line-height:1.7}
.tag.soft{background:var(--teal)}
.take p{margin:6px 0 0;font-size:18px;line-height:1.7}
.take b{color:var(--acc2)}
.take strong{color:var(--acc);font-weight:700}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.after{display:flex;gap:8px}
.after .btn{flex:1}
.after[hidden]{display:none}
.keys{margin:0;font-size:13px;color:var(--ink2)}
.rotate-hint{display:none;margin:6px 0 0;font-size:13px;color:var(--ink2)}

@media (min-width:900px) and (min-height:560px){
  #player:not([hidden]){display:flex;flex-direction:column;height:calc(100vh - 39px);min-height:520px}
  .p-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}
  .stage{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .stage svg.scene{width:100%;height:100%;aspect-ratio:auto}
  .panel{padding-top:0;min-height:0;overflow:auto}
  .ctrls{margin-top:auto}
}
@media (max-width:899px),(max-height:559px){
  .p-head{flex-wrap:wrap;padding:8px 16px;row-gap:2px}
  .pages{order:3;flex-basis:100%}
  .p-main{padding:10px 16px 16px}
  .rotate-hint{display:block}
}
@media (max-width:420px){
  #toc h1{font-size:25px}
  .p-title h2{font-size:18px}
  .cap{font-size:18px}
  .take p{font-size:17px}
  .btn{font-size:16px;padding:6px 8px}
  .cards{grid-template-columns:1fr}
  .keys{display:none}
}

/* ---------- SVG 場景 ---------- */
.scene text{font-family:var(--sans)}
.nt,.nt *{transition:none!important}
.still .scene *,.still .scene{transition:none!important;animation:none!important}
.cpu-box{fill:#ECE6D8;stroke:#8F887C;stroke-width:3;transition:stroke .4s,stroke-width .4s}
.cpu-box.hi{stroke:#C7522A;stroke-width:7}
.band-g polygon{fill:#E6DFCF;stroke:#B8B1A4;stroke-width:2;transition:fill .5s,stroke .5s}
.band-g text{fill:#24211D;font-weight:700;transition:fill .5s}
.band-g.on polygon{fill:#EFC09B;stroke:#A8431F;stroke-width:3}
.band-g.dim polygon{fill:#EFEBE2;stroke:#D2CBBE}
.band-g.dim text{fill:#A39B8D}
.band-g.hi polygon{fill:#F7CDB0;stroke:#C7522A;stroke-width:4}
.lab .f{fill:#A8431F;font-weight:700;transition:fill .5s}
.lab .m{fill:#676158;transition:fill .5s}
.lab.mute .f{fill:#A39B8D}
.lab.mute .m{fill:#B1AA9D}
.lab.on .f{fill:#C7522A}
.lab.on .m{fill:#24211D}
.blk{fill:#EFEBE2;stroke:#D2CBBE;stroke-width:1.5;transition:fill .5s,stroke .5s}
.blk.on{fill:#5E8C8A;stroke:#3E6E73}
.pc rect{fill:#EFEBE2;stroke:#D2CBBE;stroke-width:2;transition:fill .5s,stroke .5s}
.pc text{fill:#A39B8D;font-weight:700;transition:fill .5s}
.pc.on text{fill:#24211D}
.pc.on.pf rect{fill:#EDB7A6;stroke:#C7522A}
.pc.on.pd rect{fill:#AFCCDC;stroke:#4F7F99}
.pc.on.pe rect{fill:#C5D8A2;stroke:#6F8A3F}
.pc.glow rect{stroke:#C7522A;stroke-width:5}
.tb rect{stroke-width:1.5}
.tb.pf rect{fill:#EDB7A6;stroke:#C98A78}
.tb.pd rect{fill:#AFCCDC;stroke:#85A7BA}
.tb.pe rect{fill:#C5D8A2;stroke:#98AF73}
.tb text{fill:#24211D;font-weight:700}
.cell rect{fill:#EFEBE2;stroke:#D2CBBE;stroke-width:1.5}
.cell text{fill:#A39B8D}
.cell.busy rect{fill:#F1DEB0;stroke:#C99A3A}
.cell.busy text{fill:#24211D;font-weight:700}
.cell .t-b{display:none}
.cell.busy .t-b{display:inline}
.cell.busy .t-i{display:none}
.pcb rect{fill:#EFEBE2;stroke:#CFC8BA;stroke-width:2;transition:fill .5s,stroke .5s}
.pcb text{fill:#A39B8D;font-weight:700;transition:fill .5s}
.pcb.on rect{fill:#F1DEB0;stroke:#A8431F}
.pcb.on text{fill:#24211D}
.stn rect{fill:none;stroke:#B8B1A4;stroke-width:2;stroke-dasharray:6 4;transition:stroke .3s,fill .3s}
.stn.hi rect{stroke:#C7522A;fill:#F7E3D3;stroke-dasharray:none}
.sign rect{transition:fill .4s,stroke .4s}
.sign.hi rect{fill:#F7CDB0;stroke:#C7522A}
.lpicon rect{transition:stroke .2s,stroke-width .2s}
.lpicon.on rect{stroke:#C7522A;stroke-width:4}
.savebtn rect{fill:#E8E1D1;stroke:#8F887C;stroke-width:1;transition:fill .3s}
.savebtn text{fill:#24211D}
.savebtn.on rect{fill:#C7522A;stroke:#A8431F}
.savebtn.on text{fill:#FFFFFF}
.tri-c rect{fill:#FBF8F1;stroke:#B8B1A4;stroke-width:2;transition:fill .3s,stroke .3s}
.tri-c.mid rect{fill:#F4EAD2;stroke:#A8431F}
.tri-c.hi rect{fill:#F7CDB0;stroke:#C7522A;stroke-width:4}
@keyframes k-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes k-swing{from{transform:rotate(-9deg)}to{transform:rotate(5deg)}}
@keyframes k-shake{0%{transform:translate(0,0)}25%{transform:translate(-4px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,1px)}100%{transform:translate(0,0)}}
@keyframes k-bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes k-flowL{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@keyframes k-flowR{from{transform:translateX(0)}to{transform:translateX(40px)}}
.lp-spin{animation:k-spin 1.3s linear infinite}
.lp-spin-slow{animation:k-spin 2.4s linear infinite}
.lp-swing{animation:k-swing 1.4s ease-in-out infinite alternate}
.lp-shake{animation:k-shake .28s linear infinite}
.lp-bob{animation:k-bob .32s ease-in-out infinite alternate}
.lp-flowL{animation:k-flowL .9s linear infinite}
.lp-flowR{animation:k-flowR .9s linear infinite}
@media (prefers-reduced-motion:reduce){
  .scene [class*="lp-"]{animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <section id="toc" class="view" aria-labelledby="tocTitle">
    
    <h1 id="tocTitle">互動動畫：記憶體與輸入輸出</h1>
    <p class="lead">五段動畫。按「下一步」或鍵盤右鍵，一步一步往下看；每一步都有文字說明，不開聲音也看得懂。每段最後一步是「這段要記得」。</p>
    <p class="lead2">建議先看完五段動畫。</p>
    <div id="resume" class="resume" hidden></div>
    <ol id="cards" class="cards"></ol>
    <p class="howto">錄影或分享時，網址後面加 ?a=段號&amp;s=步號，可以直接打開某一段的某一步，例如 ?a=2&amp;s=4。</p>
  </section>

  <section id="player" class="view" hidden aria-label="動畫播放">
    <header class="p-head">
      <button id="bToc" class="btn small" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>回目錄</button>
      <div class="p-title">
        <span id="pSeg" class="p-seg"></span>
        <h2 id="pTitle"></h2>
      </div>
      <span id="pPages" class="pages"></span>
    </header>
    <div class="p-main">
      <div id="stage" class="stage"></div>
      <div class="panel">
        <p class="rotate-hint">手機橫放，圖會比較大。</p>
        <div class="stepbar"><span id="pStep"></span><span id="dots" class="dots" aria-hidden="true"></span></div>
        <h3 id="sTitle" class="s-title"></h3>
        <p id="cap" class="cap" aria-live="polite"></p>
        <div id="take" class="take" hidden aria-live="polite"></div>
        <div class="ctrls">
          <button id="bPrev" class="btn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>上一步</button>
          <button id="bNext" class="btn primary" type="button">下一步<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="bAuto" class="btn" type="button" aria-pressed="false"></button>
          <button id="bHome" class="btn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10a5.5 5.5 0 1 0 1.8-4.1M4.5 3.5v3.2h3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>從頭</button>
        </div>
        <div id="after" class="after" hidden>
          <button id="bNextSeg" class="btn primary" type="button"></button>
        </div>
        <p class="keys">鍵盤左右鍵也能換步。</p>
      </div>
    </div>
  </section>
  <footer class="foot">非同步自學動畫</footer>
</div>
<script>
(function () {

var DATA = {"animations":[{"no":1,"title":"記憶體的金字塔：越近越快，越遠越大","tocLine":"從砧板到倉庫，看記憶體為什麼分成四層，哪一層快、哪一層大。","tocPages":"","takeawayTag":"重點","cuts":[{"from":1,"to":8,"after":"docx [26] 第 8 段話念完","back":"教學版第 32 張，接 [27]"}],"steps":[{"title":"金字塔有四層","caption":"可以把電腦裡存東西的地方排成一座金字塔：最上面是暫存器，往下是快取記憶體和主記憶體，最下面是輔助記憶體。"},{"title":"暫存器：砧板和小碗","caption":"最上面的暫存器，是料理台上的砧板和小碗。伸手就拿得到，可是只放得下一顆洋蔥。"},{"title":"快取記憶體：小冰箱","caption":"快取記憶體是料理台旁邊的小冰箱，擺在料理區裡、靠大冰箱那一側。轉身就拿得到，放得比砧板多。"},{"title":"主記憶體：大冰箱","caption":"主記憶體是料理區外面的大冰箱，也就是手機規格上寫的 RAM。放得更多，可是要轉身走幾步。"},{"title":"輔助記憶體：倉庫","caption":"輔助記憶體是店後面的倉庫，就是硬碟、固態硬碟這些儲存裝置。放得下整箱的米，可是要走很遠。"},{"title":"越上面越快、越貴、越小","caption":"規則只有一條：越上面，速度越快、單位價格越高、容量越小；越往下，速度越慢、越便宜、容量越大。"},{"title":"四個地方比一比","caption":"把四個地方並排比一比：沒有一個地方又近、又大、又便宜，所以才分成好幾層。"},{"title":"這段要記得","caption":"記憶體的金字塔由上到下是暫存器、快取、主記憶體，最下面是輔助記憶體；越上面越快、越貴、越小。"}],"takeaway":[{"label":"記憶體的金字塔","text":"由上到下是暫存器、快取、主記憶體，最下面是輔助記憶體；越上面越快、越貴、越小。"}]},{"no":2,"title":"馮紐曼瓶頸：卡在走道，小冰箱幫忙少跑幾趟","tocLine":"CPU 再快，也得等東西沿著走道送過來；小冰箱怎麼讓它少等。","tocPages":"","takeawayTag":"重點","cuts":[{"from":1,"to":4,"after":"docx [32] 第 14 段話念完","back":"接 [33]，翻回教學版第 34 張"},{"from":5,"to":9,"after":"docx [35] 第 17 段話（公布答案）念完","back":"接 [36]"}],"steps":[{"title":"程式和資料都在記憶體","caption":"食譜（程式）貼在冰箱門上，食材（資料）放在冰箱裡。程式和資料都在記憶體，換菜只要換食譜，這叫儲存程式。"},{"title":"每一步都要來回拿","caption":"CPU 每做一步，都要跟記憶體來回拿指令和資料。食譜的下一步、要用的食材，都得沿著走道搬過來。"},{"title":"大家站著等","caption":"主廚和助手再快也沒用。東西都得沿著走道從大冰箱搬過來，走道一塞，大家只能站著等。"},{"title":"瓶頸在匯流排","caption":"這就是馮紐曼瓶頸。不論 CPU 與記憶體的速度有多快，整個系統的速度終將受限於匯流排的速度。"},{"title":"多放一台小冰箱","caption":"怎麼少跑幾趟走道？在料理台旁邊多放一台小冰箱，先把今天一直用到的蔥、蒜、蛋拿一些放進來。"},{"title":"小冰箱就是快取","caption":"這台小冰箱就是快取記憶體（cache）。它做在 CPU 裡，位置夾在暫存器和主記憶體中間。"},{"title":"轉身就拿到","caption":"要用蛋，轉身就從小冰箱拿到，走道上空空的。有了快取，CPU 不必每次都等主記憶體慢慢送資料。"},{"title":"小冰箱沒有的","caption":"小冰箱沒有豆腐，主廚報出格子號碼，還是得走走道去大冰箱拿。快取太貴、放不下那麼多，沒辦法取代主記憶體。"},{"title":"這段要記得","caption":"馮紐曼瓶頸：不論 CPU 和記憶體多快，整個系統的速度受限於匯流排的速度。重點：匯流排。儲存程式：程式和資料都放在記憶體裡，換程式不用改硬體。"}],"takeaway":[{"label":"馮紐曼瓶頸","text":"不論 CPU 和記憶體多快，整個系統的速度受限於匯流排的速度。重點：匯流排。"},{"label":"儲存程式","text":"程式和資料都放在記憶體裡，換程式不用改硬體。"}]},{"no":3,"title":"執行程式的三個步驟，加上生產線","tocLine":"擷取、解碼、執行一直循環；生產線讓好幾條指令重疊著做。","tocPages":"","takeawayTag":"重點","cuts":[{"from":1,"to":4,"after":"docx [104] 第 5 段話念完","back":"接 [105] 25 加 17"},{"from":5,"to":10,"after":"docx [113] 第 14 段話念完","back":"接 [114] 按暫停想一題"}],"steps":[{"title":"擷取指令","caption":"擷取指令：控制單元把要執行的指令從記憶體拿過來，放進指令暫存器。主廚照步驟牌，把這一步抄在小便條上。"},{"title":"解碼指令","caption":"解碼指令：小便條上是一串 0 和 1，主廚用查表的方法看懂它要做什麼：兩顆蛋打散。"},{"title":"執行指令","caption":"執行指令：助手（算術邏輯單元）打蛋，蛋先放小碗（暫存器）。結果再由控制單元存回記憶體，需要時才收回冰箱。"},{"title":"一直循環","caption":"做完一條指令，回到擷取，處理下一條，一直循環。"},{"title":"一條做完才做下一條","caption":"如果每一條都等三步做完才開始下一條，就會有人閒著：助手打蛋時主廚沒事做，主廚看食譜時助手在等。"},{"title":"兩段重疊","caption":"算術邏輯單元在執行這一條時，控制單元已經開始擷取下一條：助手在打第一步的蛋，主廚已經去抄第二步。"},{"title":"汽車工廠的生產線","caption":"可以用汽車工廠的生產線來比喻：每個工作站裝好一個零件就往後傳，接著馬上做下一台車。"},{"title":"時序圖：三段重疊","caption":"時序圖畫得更細：同一個時間，指令 1 在執行、指令 2 在解碼、指令 3 在擷取。"},{"title":"快的是整體","caption":"每一條指令一樣要走完三步；快的是整體，同樣一段時間裡，做完的指令變多了。"},{"title":"這段要記得","caption":"生產線技術（pipelining）：CPU 像汽車工廠的生產線，算術邏輯單元在執行這一條時，控制單元已經在擷取下一條。"}],"takeaway":[{"label":"生產線技術（pipelining）","text":"CPU 像汽車工廠的生產線，算術邏輯單元在執行這一條時，控制單元已經在擷取下一條。"},{"label":"程式計數器和指令暫存器","text":"步驟牌是程式計數器，記錄目前程式正在執行的指令位址；小便條是指令暫存器，儲存所執行指令（上週講過，這週再看）。"}]},{"no":4,"title":"倉庫裡的兩種硬碟：碟片在轉，晶片不動","tocLine":"打開兩種硬碟比一比：一個裡面有碟片在轉，一個只有晶片。","tocPages":"","takeawayTag":"重點","cuts":[{"from":1,"to":6,"after":"docx [183] 第 5 段話念完","back":"接 [184]"}],"steps":[{"title":"店後面的倉庫","caption":"主記憶體是大冰箱，儲存裝置就是店後面的倉庫，也叫輔助記憶體。硬碟、隨身碟都在這裡。"},{"title":"傳統硬碟裡面","caption":"傳統硬碟裡面有圓形碟片和讀寫頭。碟片一直轉，讀寫頭像一支小手臂，在碟片上面移動。"},{"title":"等它轉過來","caption":"像迴轉壽司，你要的那一盤要轉到面前才拿得到。硬碟也要等資料轉到讀寫頭底下才讀得到，所以比記憶體慢很多。"},{"title":"固態硬碟裡面","caption":"固態硬碟（SSD）雖然也叫硬碟，裡面卻沒有圓形碟片，用的是積體電路晶片。"},{"title":"省電、耐震、比較貴","caption":"沒有會轉的零件，所以比較省電、比較耐震，成本也比較高。"},{"title":"這段要記得","caption":"固態硬碟（SSD）：沒有圓形碟片，使用積體電路晶片，比較省電、耐震。"}],"takeaway":[{"label":"固態硬碟（SSD）","text":"沒有圓形碟片，使用積體電路晶片，比較省電、耐震。"}]},{"no":5,"title":"冰箱和倉庫：打開程式、停電、存檔","tocLine":"從打開 App 到停電、存檔，看東西在冰箱和倉庫之間怎麼走。","tocPages":"","takeawayTag":"重點","cuts":[{"from":1,"to":7,"after":"docx [189] 第 11 段話念完","back":"接 [190]"}],"steps":[{"title":"8GB＋256GB","caption":"手機規格常寫成「8GB＋256GB」。前面小的 8GB 是記憶體，是冰箱；後面大的 256GB 是儲存空間，是倉庫。"},{"title":"打開 App","caption":"程式和資料平時放在倉庫。你打開一個 App，它才從倉庫搬進冰箱，CPU 做事時就從冰箱拿。"},{"title":"打了一個小時還沒存檔","caption":"你在電腦上打報告，打了一個小時還沒存檔。剛打的那段文字只在冰箱（RAM）裡，倉庫裡還沒有。"},{"title":"停電","caption":"突然停電。這台冰箱有個規則：一停電，裡面全部清空。倉庫裡的東西、牆上的開店守則（ROM）都還在。"},{"title":"先存檔","caption":"那段不見，是因為它還沒存進硬碟。打完先存檔，文字就存進倉庫，停電以後重開還找得回來。"},{"title":"冰箱太小","caption":"冰箱太小放不下，就得一直跑倉庫，整個速度就慢了。切回某個 App 要重開，常常就是冰箱滿了，它先被請出去了。"},{"title":"這段要記得","caption":"主記憶體比輔助記憶體快，容量比較小。RAM 關機後資料就不見；儲存裝置是倉庫，停電東西也都還在。"}],"takeaway":[{"label":"冰箱和倉庫","text":"主記憶體比輔助記憶體快，容量比較小。RAM 關機後資料就不見；儲存裝置是倉庫，停電東西也都還在。"}]}]};

/* ---------- 狀態計算 ---------- */
function cloneP(p) { return {o: p.o, x: p.x, y: p.y, s: p.s, sx: p.sx, r: p.r, c: Object.assign({}, p.c), tx: p.tx}; }
function cloneSt(st) { var o = {}; for (var k in st) o[k] = cloneP(st[k]); return o; }
function mergeInto(st, set, no) {
  for (var id in set) {
    var p = st[id];
    if (!p) throw new Error('動畫 ' + no + ' 沒有這個元件：' + id);
    var d = set[id];
    for (var k in d) { if (k === 'c') Object.assign(p.c, d.c); else p[k] = d[k]; }
  }
}
var SCENES = {}, CACHE = {};
function getScene(a) {
  if (SCENES[a]) return SCENES[a];
  var sc = new Scene(a, DATA.animations[a - 1].title);
  SEQ[a].build(sc);
  registerLooks(sc, a);
  SCENES[a] = sc; CACHE[a] = {};
  document.getElementById('stage').appendChild(sc.svg);
  return sc;
}
/* 起點狀態要登錄每個元件所有會用到的外觀。
   paint 只會切換狀態裡列出的 class；後面步驟才加上的 on、glow、hi 這類 class，
   如果起點沒有列出，回到前面的步驟時就拿不掉。
   所以建好場景後，把每一步（含過場中的短暫提示）會切換的 class 都登錄到起點，
   值取建置當下元件有沒有這個 class；會被換字的元件也登錄建置當下的文字。
   之後每次 render 都會把這些 class、文字設回該步應有的值，從哪裡來都一樣。 */
function registerLooks(sc, a) {
  var cls = {}, txt = {};
  SEQ[a].steps.forEach(function (step) {
    step.seq.forEach(function (ev) {
      for (var id in ev[2]) {
        var d = ev[2][id];
        if (d.c) { cls[id] = cls[id] || {}; for (var c in d.c) cls[id][c] = 1; }
        if (d.tx !== undefined) txt[id] = 1;
      }
    });
  });
  Object.keys(cls).forEach(function (id) {
    var b = sc.base[id];
    if (!b) return;
    for (var c in cls[id]) if (!(c in b.c)) b.c[c] = sc.reg[id].classList.contains(c) ? 1 : 0;
  });
  Object.keys(txt).forEach(function (id) {
    var b = sc.base[id];
    if (b && b.tx === null) b.tx = sc.reg[id].textContent;
  });
}
function stateAt(a, k) {
  var sc = getScene(a);
  if (CACHE[a][k]) return CACHE[a][k];
  var st = k === 0 ? cloneSt(sc.base) : cloneSt(stateAt(a, k - 1));
  if (k > 0) SEQ[a].steps[k - 1].seq.forEach(function (ev) { if (ev[3] !== 'tr') mergeInto(st, ev[2], a); });
  CACHE[a][k] = st;
  return st;
}
function paint(sc, id, p, d, fadeOnly) {
  var el = sc.reg[id];
  if (d > 0) el.style.transition = fadeOnly ? ('opacity ' + d + 'ms ease') : ('opacity ' + d + 'ms ease, transform ' + d + 'ms cubic-bezier(.45,.05,.35,1)');
  else el.style.transition = 'none';
  el.style.opacity = p.o;
  el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px) rotate(' + p.r + 'deg) scale(' + (p.s * p.sx) + ',' + p.s + ')';
  for (var c in p.c) el.classList.toggle(c, !!p.c[c]);
  if (p.tx !== null && el.textContent !== p.tx) el.textContent = p.tx;
}
function render(sc, st, d, fadeOnly) {
  if (!d) sc.svg.classList.add('nt');
  for (var id in st) paint(sc, id, st[id], d || 0, fadeOnly);
  if (!d) { void sc.svg.getBoundingClientRect(); sc.svg.classList.remove('nt'); }
}
function setLoops(sc, list) {
  for (var id in sc.loops) sc.loops[id].el.classList.remove(sc.loops[id].cls);
  if (STILL || RM) return;
  (list || []).forEach(function (id) { var L = sc.loops[id]; if (L) L.el.classList.add(L.cls); });
}

/* ---------- 播放器 ---------- */
var P = {a: 0, k: 0, sc: null, timers: [], auto: false, autoTimer: null};
var $ = function (id) { return document.getElementById(id); };
function clearTimers() {
  P.timers.forEach(clearTimeout); P.timers = [];
  if (P.autoTimer) { clearTimeout(P.autoTimer); P.autoTimer = null; }
}
function capLen(a, k) { return DATA.animations[a - 1].steps[k - 1].caption.replace(/\s/g, '').length; }
function dwell(a, k) { return Math.max(4000, capLen(a, k) * 250); }
function seqEnd(a, k) { var e = 0; SEQ[a].steps[k - 1].seq.forEach(function (ev) { e = Math.max(e, ev[0] + ev[1]); }); return e; }
function playStep(n) {
  var def = SEQ[P.a].steps[n - 1], sc = P.sc, target = stateAt(P.a, n);
  setLoops(sc, def.loops);
  if (STILL) { render(sc, target, 0); return 0; }
  if (RM) {
    render(sc, target, 400, true);
    P.timers.push(setTimeout(function () { render(sc, target, 0); }, 600));
    return 450;
  }
  var cur = cloneSt(stateAt(P.a, n - 1)), end = 0;
  def.seq.forEach(function (ev) {
    end = Math.max(end, ev[0] + ev[1]);
    P.timers.push(setTimeout(function () {
      mergeInto(cur, ev[2], P.a);
      for (var id in ev[2]) paint(sc, id, cur[id], ev[1], false);
    }, ev[0] + 30));
  });
  P.timers.push(setTimeout(function () { render(sc, target, 0); }, end + 90));
  return end + 90;
}
function go(n, animate) {
  var N = SEQ[P.a].steps.length;
  n = Math.max(1, Math.min(N, n));
  clearTimers();
  var end = 0;
  if (animate) { render(P.sc, stateAt(P.a, n - 1), 0); end = playStep(n); }
  else { render(P.sc, stateAt(P.a, n), 0); setLoops(P.sc, SEQ[P.a].steps[n - 1].loops); }
  P.k = n;
  if (P.auto) {
    if (n >= N) setAuto(false);
    else P.autoTimer = setTimeout(function () { go(P.k + 1, true); }, end + dwell(P.a, n));
  }
  updateUI(); updateURL(); save();
}
function restart() {
  clearTimers();
  render(P.sc, stateAt(P.a, 0), 0);
  P.k = 0;
  go(1, true);
}
function setAuto(on) {
  P.auto = on;
  var b = $('bAuto');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = on
    ? '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="11.5" y="4" width="3.5" height="12" rx="1" fill="currentColor"/></svg>暫停'
    : '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor"/></svg>自動播放';
  if (!on && P.autoTimer) { clearTimeout(P.autoTimer); P.autoTimer = null; }
}
function toggleAuto() {
  if (P.auto) { setAuto(false); return; }
  setAuto(true);
  var N = SEQ[P.a].steps.length;
  if (P.k >= N) restart();
  else P.autoTimer = setTimeout(function () { go(P.k + 1, true); }, 700);
}
function kw(parent, text, words) {
  if (!words || !words.length) { parent.appendChild(document.createTextNode(text)); return; }
  var re = new RegExp('(' + words.join('|') + ')', 'g');
  text.split(re).forEach(function (part) {
    if (!part) return;
    if (words.indexOf(part) >= 0) { var s = document.createElement('strong'); s.textContent = part; parent.appendChild(s); }
    else parent.appendChild(document.createTextNode(part));
  });
}
var BOLD = {3: ['汽車工廠', '生產線技術', '指令位址']};
function updateUI() {
  var A = DATA.animations[P.a - 1], N = A.steps.length, st = A.steps[P.k - 1], last = P.k === N;
  $('pSeg').textContent = '第 ' + P.a + ' 段／共 5 段';
  $('pTitle').textContent = A.title;
  $('pPages').textContent = '對應' + A.tocPages;
  $('pStep').textContent = '第 ' + P.k + ' 步／共 ' + N + ' 步';
  $('sTitle').textContent = st.title;
  var dots = $('dots'); dots.textContent = '';
  for (var i = 1; i <= N; i++) { var d = document.createElement('span'); d.className = 'dot' + (i < P.k ? ' done' : '') + (i === P.k ? ' cur' : ''); dots.appendChild(d); }
  var cap = $('cap'), take = $('take');
  if (last) {
    cap.hidden = true; cap.textContent = ''; take.hidden = false; take.textContent = '';
    var h = document.createElement('p'); h.className = 'take-h';
    var tg = document.createElement('span'); tg.className = 'tag' + (A.takeawayTag === '重點' ? '' : ' soft'); tg.textContent = A.takeawayTag; h.appendChild(tg);
    take.appendChild(h);
    A.takeaway.forEach(function (it) {
      var p = document.createElement('p');
      var b = document.createElement('b'); b.textContent = it.label + '：'; p.appendChild(b);
      kw(p, it.text, BOLD[P.a]);
      take.appendChild(p);
    });
  } else { take.hidden = true; take.textContent = ''; cap.hidden = false; cap.textContent = st.caption; }
  $('bPrev').disabled = P.k <= 1;
  $('bNext').disabled = last;
  var after = $('after'), nb = $('bNextSeg');
  after.hidden = !last;
  nb.textContent = P.a < 5 ? '看下一段：第 ' + (P.a + 1) + ' 段' : '回目錄';
}
function buildURL(a, s) {
  var q = new URLSearchParams();
  if (a) { q.set('a', a); if (s) q.set('s', s); }
  if (STILL) q.set('still', '1');
  var str = q.toString();
  return location.pathname + (str ? '?' + str : '');
}
function updateURL() { try { history.replaceState(null, '', buildURL(P.a, P.k)); } catch (e) {} }
function save() { try { localStorage.setItem('w05anim-last', JSON.stringify({a: P.a, s: P.k})); } catch (e) {} }
function load() { try { var v = JSON.parse(localStorage.getItem('w05anim-last') || 'null'); if (v && v.a >= 1 && v.a <= 5 && v.s >= 1) return v; } catch (e) {} return null; }

function showToc() {
  clearTimers(); setAuto(false);
  if (P.sc) setLoops(P.sc, []);
  $('player').hidden = true; $('toc').hidden = false;
  document.title = '第 5 週互動動畫';
  var last = load(), rs = $('resume');
  rs.textContent = '';
  if (last && DATA.animations[last.a - 1] && last.s <= DATA.animations[last.a - 1].steps.length) {
    rs.appendChild(document.createTextNode('上次看到第 ' + last.a + ' 段第 ' + last.s + ' 步。'));
    var a = document.createElement('a'); a.href = buildURL(last.a, last.s); a.textContent = '從那裡接著看';
    a.addEventListener('click', function (e) { e.preventDefault(); nav(last.a, last.s); });
    rs.appendChild(a); rs.hidden = false;
  } else rs.hidden = true;
}
function openAnim(a, s) {
  clearTimers(); setAuto(false);
  if (P.sc) setLoops(P.sc, []);
  $('toc').hidden = true; $('player').hidden = false;
  var sc = getScene(a);
  for (var k in SCENES) SCENES[k].svg.style.display = (Number(k) !== a) ? 'none' : '';
  P.a = a; P.sc = sc;
  document.title = '第 ' + a + ' 段｜第 5 週互動動畫';
  var N = SEQ[a].steps.length;
  if (s >= 1 && s <= N) go(s, false); else restart();
}
function nav(a, s) {
  try { history.pushState(null, '', buildURL(a, s)); } catch (e) {}
  if (a) openAnim(a, s); else showToc();
  window.scrollTo(0, 0);
}
function parse(search) {
  var q = new URLSearchParams(search), a = parseInt(q.get('a'), 10), s = parseInt(q.get('s'), 10);
  if (!(a >= 1 && a <= 5)) return {a: 0, s: 0};
  var N = SEQ[a].steps.length;
  return {a: a, s: (s >= 1 && s <= N) ? s : 0};
}
function route() { var r = parse(location.search); if (r.a) openAnim(r.a, r.s); else showToc(); }

/* 目錄卡片 */
function buildToc() {
  var ol = $('cards');
  DATA.animations.forEach(function (A, i) {
    var a = i + 1, li = document.createElement('li'); li.className = 'card';
    var go1 = document.createElement('a'); go1.className = 'go'; go1.href = buildURL(a, 0);
    go1.addEventListener('click', function (e) { e.preventDefault(); nav(a, 0); });
    var n = document.createElement('span'); n.className = 'num'; n.textContent = a; go1.appendChild(n);
    var box = document.createElement('span');
    var h = document.createElement('h3'); h.textContent = A.title; box.appendChild(h);
    var p = document.createElement('p'); p.textContent = A.tocLine; box.appendChild(p);
    var m = document.createElement('p'); m.className = 'meta'; m.textContent = '對應' + A.tocPages + '・' + A.steps.length + ' 步'; box.appendChild(m);
    go1.appendChild(box); li.appendChild(go1);
    (A.cuts || []).forEach(function (c) {
      if (c.from > 1) {
        var sub = document.createElement('a'); sub.className = 'sub'; sub.href = buildURL(a, c.from);
        sub.textContent = '從第 ' + c.from + ' 步開始看（後半段）';
        sub.addEventListener('click', function (e) { e.preventDefault(); nav(a, c.from); });
        li.appendChild(sub);
      }

    ol.appendChild(li);
  });
}

$('bToc').addEventListener('click', function () { nav(0, 0); });
$('bPrev').addEventListener('click', function () { setAuto(false); if (P.k > 1) go(P.k - 1, false); });
$('bNext').addEventListener('click', function () { if (P.k < SEQ[P.a].steps.length) go(P.k + 1, true); });
$('bHome').addEventListener('click', function () { restart(); });
$('bAuto').addEventListener('click', toggleAuto);
$('bNextSeg').addEventListener('click', function () { if (P.a < 5) nav(P.a + 1, 0); else nav(0, 0); });
document.addEventListener('keydown', function (e) {
  if ($('player').hidden || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); if (P.k < SEQ[P.a].steps.length) go(P.k + 1, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); setAuto(false); if (P.k > 1) go(P.k - 1, false); }
});
window.addEventListener('popstate', route);

setAuto(false);
buildToc();
route();

/* 給測試用的唯讀介面 */
window.__W05 = {
  parse: parse,
  steps: function (a) { return SEQ[a].steps.length; },
  state: function () { return {a: P.a, k: P.k, still: STILL}; },
  show: function (a, s) { openAnim(a, s); return {a: P.a, k: P.k, caption: $('cap').hidden ? $('take').textContent : $('cap').textContent}; },
  timing: function () { var out = []; for (var a = 1; a <= 5; a++) { var t = 0; for (var k = 1; k <= SEQ[a].steps.length; k++) t += seqEnd(a, k) + 90 + dwell(a, k); out.push(t); } return out; }
};
